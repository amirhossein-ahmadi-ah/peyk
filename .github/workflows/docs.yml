name: Docs & Site

on:
  push:
    branches: [main]
    paths:
      - "docs/"
      - "peyk/"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install peyk + docs deps
        run: python -m pip install -e ".[docs,bale,telegram,rubika]"

      - name: Build Sphinx
        run: sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Assemble _site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/documentation

          if [ ! -f docs/mainpage.html ]; then
            echo "::error::docs/mainpage.html پیدا نشد"; exit 1
          fi

          cp docs/mainpage.html _site/index.html
          cp -R docs/_build/html/. _site/documentation/
          touch _site/.nojekyll

          echo "--- _site ---"; ls -la _site
          echo "--- _site/documentation ---"; ls -la _site/documentation | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
