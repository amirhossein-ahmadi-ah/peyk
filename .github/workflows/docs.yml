name: Docs

# Builds the Sphinx documentation and publishes it to GitHub Pages on every
# push to main, so the published docs always match the latest code.
# One-time manual step required before this works: in the repo's Settings ->
# Pages, set "Build and deployment / Source" to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs peyk itself (so autodoc can import every module) plus the
      # docs extras (sphinx + furo) declared in pyproject.toml.
      - name: Install peyk with docs dependencies
        run: python -m pip install -e ".[docs,bale,telegram,rubika]"

      - name: Build Sphinx documentation
        run: sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
