name: Publish to PyPI

# Runs when you publish a GitHub Release (tag it v1.0.0 to match the version
# in pyproject.toml). Uses PyPI's Trusted Publisher (OIDC) mechanism, so no
# PyPI API token has to be stored as a GitHub secret.
#
# One-time manual step required before this works: on pypi.org, add a
# "pending trusted publisher" for the project name "peyk" pointing at this
# repository (see the publishing guide in the repo root for exact steps).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/peyk/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
