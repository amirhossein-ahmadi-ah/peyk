name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Version normal commits as post releases
        if: github.event_name == 'push'
        env:
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"$', text)
          if not match:
              raise SystemExit("project version not found in pyproject.toml")
          base = match.group(1)
          version = f"{base}.post{os.environ['RUN_NUMBER']}"
          path.write_text(text[:match.start(1)] + version + text[match.end(1):])

          init = Path("src/peyk/__init__.py")
          init_text = init.read_text()
          init_text = re.sub(r'(?m)^__version__\s*=\s*"[^"]+"$', f'__version__ = "{version}"', init_text)
          init.write_text(init_text)
          print(f"Publishing commit build as {version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/peyk/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
